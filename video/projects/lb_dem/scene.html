<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<title>Lightboard макет — KAINAP</title>
<link rel="stylesheet" href="../../engine/style.css">
<style>
  :root { --gold: #FFC46B; }
  #stage { background: #030308; }
  .abs { position: absolute; }
  .scene.full { top: 0; height: 1920px; display: block; }
  .peep { position: absolute; }
  .glass { position: absolute; left: 40px; right: 40px; top: 260px; height: 1180px; border-radius: 10px; background: linear-gradient(135deg, rgba(255,255,255,.05), rgba(255,255,255,.01)); }
  .led { position: absolute; left: 40px; right: 40px; top: 260px; height: 1180px; border-radius: 10px; border: 6px solid rgba(160,230,255,.9); box-shadow: 0 0 30px rgba(120,220,255,.8), inset 0 0 40px rgba(120,220,255,.35); }
  .neon { position: absolute; font-weight: 900; white-space: nowrap; color: #F2FFF0; text-shadow: 0 0 6px #7CFF6B, 0 0 18px #39FF14, 0 0 44px #39FF14; }
  .neon.pink { color: #FFF0F6; text-shadow: 0 0 6px #FF7AC0, 0 0 18px #FF2E93, 0 0 44px #FF2E93; }
  .neon.blue { color: #F0FBFF; text-shadow: 0 0 6px #7FD8FF, 0 0 18px #1EA7FF, 0 0 44px #1EA7FF; }
  .bubble { position: absolute; left: 90px; right: 90px; background: #1C1F3F; border-radius: 34px; padding: 26px 34px; color: #fff; font-weight: 800; font-size: 46px; line-height: 1.3; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .bubble b { display: block; font-size: 28px; color: #9AA0D0; margin-bottom: 6px; letter-spacing: 1px; }
  .bubble.me { background: #3A3CF4; }
  .chip { position: absolute; right: 50px; top: 60px; font-weight: 900; font-size: 26px; color: rgba(255,255,255,.55); border: 2px solid rgba(255,255,255,.3); border-radius: 999px; padding: 8px 20px; z-index: 9; letter-spacing: 2px; }
  .cap { top: 1560px; left: 60px; right: 60px; z-index: 8; }
  .cap-box { background: none; box-shadow: none; color: #fff; font-size: 60px; line-height: 1.25; text-shadow: 0 4px 18px rgba(0,0,0,.95); padding: 0; }
  .cap-box .w { padding: 0 3px; }
  .cap-box .w.key { color: var(--gold); }
  .logo { position: absolute; left: 0; right: 0; top: 1790px; text-align: center; z-index: 8; }
  .logo span { font-weight: 900; font-size: 34px; color: rgba(255,255,255,.75); letter-spacing: 6px; }
</style>
</head>
<body class="cap-plain" data-pops="off" data-smooth>
<div id="stage">
  <section class="scene full" data-from="s1-2.6">
    <div class="abs" style="inset:0;transform-origin:50% 45%" data-zoom="1,1.04" data-punch="s2$+0.2">
      <!-- после дропа: цветной свет -->
      <div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(60,70,255,.35),rgba(0,0,0,0) 65%)" data-in="s2$+0.2" data-anim="fade"></div>
      <!-- агай за стеклом -->
      <div class="peep" data-peep="agai" style="left:110px;top:680px;width:860px" data-in="s1-2.4" data-anim="fade" data-expr="s1-2.4:Suspicious,s1:Calm,s2:Serious,s2$+0.2:Driven,s3:Explaining,s4:Cheeky" data-talk="s1~s1$,s2~s2$,s3~s3$,s4~s4$"></div>
      <div class="glass"></div>
      <div class="led" data-in="s2$+0.2" data-anim="fade"></div>
      <div class="abs" style="inset:0;background:#fff" data-in="s2$+0.2" data-anim="fade" data-out="s2$+0.35"></div>
      <!-- ситуация -->
      <div class="abs" style="inset:0" data-out="s1-0.1"><div class="bubble" style="top:470px" data-in="s1-2.3" data-anim="up" data-sfx="softpop"><b>КЛАССТАШ</b>Химия жашоодо эч керек эмес 🙄</div></div>
      <!-- надписи на стекле -->
      <div class="neon" style="left:110px;top:420px;font-size:70px" data-in="s2$+0.35" data-write="s2$+0.35|1.5">C₆H₁₂O₆ + 6O₂</div>
 <div class="neon" style="left:150px;top:530px;font-size:70px" data-in="s2$+1.9" data-write="s2$+1.9|1.5">→ 6CO₂ + 6H₂O + E</div>
 <div class="neon pink" style="left:150px;top:650px;font-size:60px" data-in="s3#0" data-write="s3#0|1.2">дем алуу = химия 🫁</div>
      
    </div>
  </section>
  <div class="chip">МАКЕТ</div>
  <div class="logo"><span>KAINAP</span></div>
  <div class="cap"></div>
</div>
<script src="build/timings.js"></script>
<script src="../../engine/engine.js"></script>
<script src="../../assets/peeps/cast.js"></script>
<script src="../../engine/peeps.js"></script>
</body>
</html>
