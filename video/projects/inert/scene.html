<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<title>Инерттүү газ — KAINAP</title>
<link rel="stylesheet" href="../../engine/style.css">
<style>
  html, body, #stage { width: 1920px !important; height: 1080px !important; }
  :root { --gold: #FFC46B; --heart: #FF3B5C; --blue: #7FB8FF; --red: #FF5A6E; --neon: #FF6A3D; }
  #stage { background: #05060E; }
  .abs { position: absolute; }
  .scene.full { top: 0; height: 1080px; display: block; overflow: hidden; }
  .world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .person { position: absolute; }
  .sil { filter: drop-shadow(4px 0 1px rgba(255,170,90,.95)) drop-shadow(-3px 0 1px rgba(140,160,255,.65)) drop-shadow(0 0 16px rgba(255,170,90,.22)); }
  .sil.cold { filter: drop-shadow(4px 0 1px rgba(150,190,255,.95)) drop-shadow(-3px 0 1px rgba(150,190,255,.5)) drop-shadow(0 0 16px rgba(127,184,255,.25)); }
  .vign { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 42%, rgba(0,0,0,.82) 100%); pointer-events: none; }
  .bokeh, .skyline, .rain { position: absolute; overflow: hidden; }
  .rain { inset: 0; pointer-events: none; opacity: .7; }
  .lampglow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,200,130,.55), rgba(255,200,130,0) 65%); }
  .cone { position: absolute; background: linear-gradient(rgba(255,205,140,.30), rgba(255,205,140,0)); clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); }
  .phoneglow { position: absolute; width: 26px; height: 40px; margin: -20px -13px; border-radius: 5px; background: #CFE3FF; box-shadow: 0 0 30px 10px rgba(160,200,255,.55), 0 0 90px 30px rgba(160,200,255,.18); }
  .phone { position: absolute; width: 420px; height: 780px; border-radius: 56px; background: #0B0E1C; border: 10px solid #1C2033; box-shadow: 0 0 80px rgba(120,150,255,.25); overflow: hidden; font-family: 'Nunito', sans-serif; }
  .phone .top { padding: 54px 30px 20px; border-bottom: 1px solid rgba(255,255,255,.08); color: #fff; font-weight: 900; font-size: 34px; }
  .phone .top small { display: block; font-size: 22px; color: #7FE0A0; font-weight: 700; margin-top: 4px; }
  .msg { position: absolute; right: 26px; max-width: 300px; background: #3A3CF4; color: #fff; font-weight: 800; font-size: 28px; padding: 14px 22px; border-radius: 26px 26px 6px 26px; }
  .read { position: absolute; right: 30px; font-weight: 800; font-size: 22px; color: var(--gold); }
  .typing { position: absolute; left: 26px; background: #22263A; border-radius: 22px; padding: 14px 22px; display: flex; gap: 8px; }
  .typing i { width: 12px; height: 12px; border-radius: 50%; background: #9AA0B8; display: block; }
  .tube { position: absolute; font-weight: 900; font-size: 190px; letter-spacing: 6px; }
  .tube small { display: block; font-size: 34px; letter-spacing: 3px; text-align: center; font-weight: 800; }
  .shell { position: absolute; border-radius: 50%; border: 3px solid rgba(255,140,90,.35); }
  .spin { position: absolute; width: 0; height: 0; }
  .el { position: absolute; width: 30px; height: 30px; margin: -15px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE7D6, #FF7A45 60%, #D3401A); box-shadow: 0 0 18px rgba(255,110,60,.9); }
  .nuc { position: absolute; width: 120px; height: 120px; margin: -60px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 38px; background: radial-gradient(circle at 40% 35%, #FFE6B0, #F0A63A 60%, #B5701A); color: #2a1600; box-shadow: 0 0 50px rgba(240,166,58,.6); }
  .heart { position: absolute; width: 70px; height: 64px; margin: -32px 0 0 -35px; filter: drop-shadow(0 0 12px rgba(255,59,92,.95)) drop-shadow(0 0 46px rgba(255,59,92,.55)); }
  .halo { position: absolute; width: 380px; height: 380px; margin: -190px; border-radius: 50%; background: radial-gradient(circle, rgba(255,70,100,.33), rgba(255,70,100,0) 65%); }
  .lbl { font-weight: 900; white-space: nowrap; text-shadow: 0 0 24px rgba(0,0,0,.6); }
  .stamp { font-weight: 900; color: #fff; padding: 8px 26px; font-size: 46px; letter-spacing: 3px; border-radius: 8px; transform: rotate(-6deg); white-space: nowrap; }
  .card { background: rgba(10,12,30,.86); border: 3px solid rgba(255,196,107,.6); border-radius: 30px; padding: 44px 64px; text-align: left; box-shadow: 0 0 60px rgba(255,196,107,.15); }
  .crow { font-weight: 900; font-size: 44px; color: #fff; margin: 16px 0; line-height: 1.25; }
  .crow b { color: var(--gold); }
  .cap { top: auto; bottom: 56px; left: 200px; right: 200px; z-index: 9; }
  .cap-box { background: none; box-shadow: none; color: #fff; font-size: 50px; line-height: 1.3; text-shadow: 0 4px 18px rgba(0,0,0,.95); padding: 0; max-width: 1500px; }
  .cap-box .w { padding: 0 3px; }
  .cap-box .w.key { color: var(--gold); }
  .cap-box .w.red { color: var(--red); }
  .corner-logo { position: absolute; right: 50px; top: 40px; width: 104px; opacity: .5; z-index: 9; }
</style>
</head>
<body class="cap-plain" data-pops="off" data-xfade="0.8">
<div id="stage">

  <!-- 1. Ночная улица, дождь: он под фонарём с телефоном, она в окне -->
  <section class="scene full" data-from="s1-0.6">
    <div class="world" data-cam="s1-0.6:1.0,960,540;s1:1.25,760,560,3.0">
      <div class="abs" style="inset:0;background:linear-gradient(#070A22 0%,#0E1438 60%,#18204F 100%)"></div>
      <div class="skyline" style="left:0;top:430px;width:1920px;height:470px" data-seed="21" data-h="470" data-color="#060818" data-win="rgba(255,205,120,.35)"></div>
      <!-- окно, в котором она -->
      <div class="abs" style="left:1340px;top:330px;width:250px;height:320px;background:linear-gradient(#FFD9A0,#F2A85E);box-shadow:0 0 80px rgba(255,190,110,.5);border:10px solid #04050C"></div>
      <div class="person" data-person="girl" style="left:1390px;top:400px;height:300px;filter:brightness(0)" data-pose="s1-0.6:phone" data-face="left"></div>
      <div class="abs" style="left:1330px;top:640px;width:270px;height:30px;background:#04050C"></div>
      <div class="abs" style="left:0;right:0;top:900px;height:180px;background:#020308"></div>
      <!-- фонарь -->
      <div class="abs" style="left:556px;top:300px;width:10px;height:600px;background:#000"></div>
      <div class="abs" style="left:540px;top:290px;width:60px;height:22px;background:#000;border-radius:8px"></div>
      <div class="lampglow" style="left:420px;top:180px;width:300px;height:300px"></div>
      <div class="cone" style="left:390px;top:312px;width:420px;height:590px"></div>
      <div class="person sil" data-person="boy" style="left:640px;top:370px;height:530px" data-pose="s1-0.6:phone"></div>
      <div class="phoneglow" style="left:820px;top:518px"></div>
      <div class="rain" data-drops="120" data-speed="0.9"></div>
    </div>
    <div class="vign"></div>
  </section>

  <!-- 2. Экран телефона: «Окулду», печатает… и тишина -->
  <section class="scene full" data-from="s2">
    <div class="world" data-cam="s2:1.0,960,540;s2:1.12,960,560,3.4">
      <div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 45%,#141838,#05060E 70%)"></div>
      <div class="abs" style="inset:0;background:radial-gradient(circle at 50% 50%,rgba(200,20,50,.28),rgba(0,0,0,0) 60%)" data-in="s2#5" data-anim="fade"></div>
      <div class="bokeh" style="inset:0" data-n="12"></div>
      <div class="phone" style="left:750px;top:150px">
        <div class="top">Ал 🤍<small>желеде</small></div>
        <div class="msg" style="top:180px" data-in="s2#0" data-anim="up">Кайдасың?</div>
        <div class="msg" style="top:260px" data-in="s2#1" data-anim="up">Жооп берчи… 🥺</div>
        <div class="read" style="top:338px" data-in="s2#2" data-anim="fade">Окулду ✓✓</div>
        <div class="typing" style="top:400px" data-in="s2#3" data-anim="pop" data-out="s2#5"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div class="vign"></div>
  </section>

  <!-- 3. Она у реки, луна -->
  <section class="scene full" data-from="s3">
    <div class="world" data-cam="s3:1.0,960,540;s3:1.15,900,600,2.6">
      <div class="abs" style="inset:0;background:linear-gradient(#070A22,#121A48 60%,#1A2458)"></div>
      <div class="abs" style="left:1260px;top:110px;width:150px;height:150px;border-radius:50%;background:#F4F1EA;box-shadow:0 0 90px rgba(244,241,234,.55)"></div>
      <div class="skyline" style="left:0;top:470px;width:1920px;height:200px" data-seed="31" data-h="200" data-color="#0A0E2A" data-win="rgba(255,205,120,.5)"></div>
      <div class="abs" style="left:0;right:0;top:670px;height:180px;background:linear-gradient(#101A44,#0A1030)"></div>
      <div class="abs" style="left:1300px;top:690px;width:70px;height:150px;background:linear-gradient(rgba(244,241,234,.55),rgba(244,241,234,0));filter:blur(3px)" data-float></div>
      <div class="abs" style="left:0;right:0;top:850px;height:230px;background:#020308"></div>
      <div class="abs" style="left:640px;top:740px;width:360px;height:16px;background:#000;border-radius:4px"></div>
      <div class="abs" style="left:656px;top:750px;width:12px;height:100px;background:#000"></div><div class="abs" style="left:972px;top:750px;width:12px;height:100px;background:#000"></div>
      <div class="person sil" data-person="girl" style="left:690px;top:368px;height:500px" data-pose="s3-1:sitphone"></div>
      <div class="phoneglow" style="left:842px;top:612px"></div>
    </div>
    <div class="vign"></div>
  </section>

  <!-- 4. Неоновые трубки: гелий, неон, аргон -->
  <section class="scene full" data-from="s4">
    <div class="world" data-cam="s4:1.0,960,540;s5#0:1.35,520,500,1.4;s5#1:1.35,960,500,1.4;s5#2:1.35,1400,500,1.4">
      <div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 45%,#120F26,#04050C 70%)"></div>
      <div class="bokeh" style="inset:0" data-n="10"></div>
      <div class="abs lbl" style="left:0;right:0;top:150px;text-align:center;font-size:60px;color:var(--gold)" data-in="s4#6" data-anim="fade" data-out="s5#0">инерттүү газдар</div>
      <div class="tube" style="left:370px;top:360px;color:#FFD2C2;text-shadow:0 0 10px #FF9C7A,0 0 30px #FF7A5A,0 0 80px #FF5A3A" data-in="s5#0" data-anim="fade">He<small>гелий</small></div>
      <div class="tube" style="left:815px;top:360px;color:#FFD0B8;text-shadow:0 0 10px #FF6A3D,0 0 30px #FF4A1D,0 0 90px #FF3A0D" data-in="s5#1" data-anim="fade">Ne<small>неон</small></div>
      <div class="tube" style="left:1270px;top:360px;color:#E9D8FF;text-shadow:0 0 10px #B48CFF,0 0 30px #9A6AFF,0 0 80px #7A4AFF" data-in="s5#2" data-anim="fade">Ar<small>аргон</small></div>
    </div>
    <div class="vign"></div>
  </section>

  <!-- 5–6. Атом неона: слой полный; сердце отскакивает -->
  <section class="scene full" data-from="s6">
    <div class="world" data-cam="s6:1.25,960,520;s6#3:1.0,960,540,1.8;s7#6:1.15,820,540,1.2">
      <div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 45%,#1E0C10,#05060E 70%)"></div>
      <div class="bokeh" style="inset:0" data-n="10"></div>
      <div class="abs" style="left:1060px;top:520px" data-shake="s7#6+0.1">
        <div class="shell" style="left:-120px;top:-120px;width:240px;height:240px"></div>
        <div class="shell" style="left:-260px;top:-260px;width:520px;height:520px;border-color:rgba(255,140,90,.6);box-shadow:0 0 40px rgba(255,110,60,.25)" data-hl="s6#3"></div>
        <div class="spin" data-spin="40"><div class="el" style="left:120px;top:0"></div><div class="el" style="left:-120px;top:0"></div></div>
        <div class="spin" data-spin="-18">
          <div class="el" style="left:260px;top:0"></div><div class="el" style="left:184px;top:184px"></div><div class="el" style="left:0;top:260px"></div><div class="el" style="left:-184px;top:184px"></div>
          <div class="el" style="left:-260px;top:0"></div><div class="el" style="left:-184px;top:-184px"></div><div class="el" style="left:0;top:-260px"></div><div class="el" style="left:184px;top:-184px"></div>
        </div>
        <div class="nuc">10+</div>
      </div>
      <div class="abs lbl" style="left:1380px;top:200px;font-size:64px;color:#FFB08A">Ne <span style="color:#fff;font-size:40px">2 · 8</span></div>
      <div class="abs lbl" style="left:1400px;top:690px;font-size:44px;color:var(--gold)" data-in="s6#3" data-anim="up">8 / 8 — толук ✓</div>
      <!-- сердце-«сообщение» летит и отскакивает -->
      <div class="halo" style="left:200px;top:520px" data-in="s7" data-anim="fade" data-move="s7:0,0;s7#2:560,0,1.4;s7#6:300,30,0.6"></div>
      <div class="heart" data-beat="80" style="left:200px;top:520px" data-in="s7" data-anim="fade" data-move="s7:0,0;s7#2:560,0,1.4;s7#6:300,30,0.6"></div>
      <div class="abs stamp" style="left:560px;top:330px;background:#D9213E;box-shadow:0 0 40px rgba(217,33,62,.5)" data-in="s7#7" data-anim="pop">РЕАКЦИЯ ЖОК</div>
    </div>
    <div class="vign"></div>
  </section>

  <!-- 7. Один в луче: полное кольцо у груди -->
  <section class="scene full" data-from="s8">
    <div class="world" data-cam="s8:1.0,960,540;s8:1.2,960,520,3.4">
      <div class="abs" style="inset:0;background:#04050B"></div>
      <div class="abs" style="left:0;right:0;top:760px;height:320px;background:repeating-conic-gradient(#0D0F1C 0 25%,#05060C 0 50%) 0 0/160px 160px;transform:perspective(600px) rotateX(55deg);transform-origin:50% 0;opacity:.9"></div>
      <div class="cone" style="left:640px;top:0;width:640px;height:960px;background:linear-gradient(rgba(220,230,255,.26),rgba(220,230,255,0))"></div>
      <div class="person sil cold" data-person="boy" style="left:880px;top:330px;height:560px" data-pose="s8:down,s8#4:stand"></div>
      <!-- кольцо из 8 электронов у груди -->
      <div class="abs" style="left:960px;top:520px" data-in="s8#4" data-anim="pop">
        <div class="shell" style="left:-110px;top:-110px;width:220px;height:220px;border-color:rgba(255,140,90,.55)"></div>
        <div class="spin" data-spin="24">
          <div class="el" style="left:110px;top:0"></div><div class="el" style="left:78px;top:78px"></div><div class="el" style="left:0;top:110px"></div><div class="el" style="left:-78px;top:78px"></div>
          <div class="el" style="left:-110px;top:0"></div><div class="el" style="left:-78px;top:-78px"></div><div class="el" style="left:0;top:-110px"></div><div class="el" style="left:78px;top:-78px"></div>
        </div>
      </div>
      <div class="abs lbl" style="left:1150px;top:300px;font-size:56px;color:rgba(255,255,255,.55);text-decoration:line-through" data-in="s8#2" data-anim="fade">мүнөз</div>
      <div class="abs lbl" style="left:1150px;top:380px;font-size:64px;color:var(--gold)" data-in="s8#5" data-anim="up">түзүлүш</div>
    </div>
    <div class="vign"></div>
  </section>

  <!-- 8. Эстеп кал (ЖРТ) -->
  <section class="scene full" data-from="s9">
    <div class="world" data-cam="s9:1.06,960,520;s9:1.0,960,540,4">
      <div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 45%,#141838,#05060E 70%)"></div>
      <div class="bokeh" style="inset:0" data-n="10"></div>
      <div class="abs card" style="left:260px;top:110px;width:1400px" data-in="s9#0" data-anim="up">
        <div class="lbl" style="font-size:42px;margin-bottom:10px;color:var(--gold)">📌 Эстеп кал</div>
        <div class="crow" data-in="s9#2" data-anim="fade">Инерттүү газдар: <b>He, Ne, Ar, Kr, Xe, Rn</b></div>
        <div class="crow" data-in="s9#3" data-anim="fade">VIIIA топ (18-топ)</div>
        <div class="crow" data-in="s9#5" data-anim="fade">Сырткы катмары <b>толук</b>: He — 2e⁻, калгандары — 8e⁻</div>
        <div class="crow" data-in="s9#9" data-anim="fade">→ <b>туруктуу</b>: реакцияга дээрлик кирбейт</div>
      </div>
    </div>
    <div class="vign"></div>
  </section>

  <!-- 9. Дождь: она опускает телефон, он уходит -->
  <section class="scene full" data-from="s10">
    <div class="world" data-cam="s10:1.0,960,540;s10:1.12,760,560,4">
      <div class="abs" style="inset:0;background:linear-gradient(#060820,#0D1236 60%,#151C48)"></div>
      <div class="skyline" style="left:0;top:470px;width:1920px;height:430px" data-seed="41" data-h="430" data-color="#05071A" data-win="rgba(255,205,120,.3)"></div>
      <div class="abs" style="left:0;right:0;top:900px;height:180px;background:#020308"></div>
      <div class="abs" style="left:0;right:0;top:900px;height:6px;background:rgba(255,200,130,.25)"></div>
      <div class="abs" style="left:456px;top:300px;width:10px;height:600px;background:#000"></div>
      <div class="lampglow" style="left:320px;top:180px;width:300px;height:300px"></div>
      <div class="cone" style="left:290px;top:312px;width:420px;height:590px"></div>
      <div class="person sil" data-person="girl" style="left:520px;top:380px;height:520px" data-pose="s10:phone,s10#4:down" data-face="right"></div>
      <div class="phoneglow" style="left:697px;top:524px" data-out="s10#4"></div>
      <div class="person sil cold" data-person="boy" style="left:1500px;top:480px;height:420px" data-walk="s10#2-s11:-330" data-pose="s10:stand"></div>
      <div class="rain" data-drops="140" data-speed="1"></div>
    </div>
    <div class="vign"></div>
  </section>

  <!-- 10. Она за столом под лампой: сердце над книгой -->
  <section class="scene full" data-from="s11">
    <div class="world" data-cam="s11:1.0,960,540;s11:1.12,960,580,3.6">
      <div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 30%,#2A1E14,#07070C 70%)"></div>
      <div class="abs" style="left:956px;top:0;width:8px;height:240px;background:#000"></div>
      <div class="abs" style="left:880px;top:236px;width:160px;height:60px;background:#000;border-radius:80px 80px 0 0"></div>
      <div class="cone" style="left:560px;top:290px;width:800px;height:520px"></div>
      <div class="abs" style="left:520px;top:780px;width:880px;height:26px;background:#140E0A;border-radius:6px"></div>
      <div class="abs" style="left:780px;top:758px;width:220px;height:24px;background:#F4EBDA;border-radius:4px;box-shadow:0 0 50px rgba(255,214,140,.7)" data-in="s11#4" data-anim="fade"></div>
      <div class="person sil" data-person="girl" style="left:560px;top:343px;height:480px" data-pose="s11-1:read,s11#6:sithold"></div>
      <div class="abs" style="left:600px;top:700px;width:130px;height:14px;background:#000"></div><div class="abs" style="left:606px;top:700px;width:10px;height:200px;background:#000"></div><div class="abs" style="left:714px;top:700px;width:10px;height:200px;background:#000"></div><div class="abs" style="left:600px;top:520px;width:12px;height:190px;background:#000"></div>
      <div class="halo" style="left:955px;top:610px" data-in="s11#6" data-anim="fade"></div>
      <div class="heart" data-beat="68" style="left:955px;top:610px" data-in="s11#6" data-anim="pop" data-scale="s11#6:1,s11$:1.2"></div>
    </div>
    <div class="vign"></div>
  </section>

  <img class="corner-logo" src="../../assets/brand/kainap-logo-white.png" alt="">
  <div class="cap"></div>
</div>
<script src="build/timings.js"></script>
<script src="../../engine/engine.js"></script>
<script src="../../engine/people.js"></script>
<script src="../../engine/fx.js"></script>
</body>
</html>
