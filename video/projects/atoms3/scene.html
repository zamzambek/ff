<!doctype html>
<html lang="ky">
<head>

<title>ЖРТ-лайфхак #3 — KAINAP</title>

<style>
  .peep { position: absolute; }
  .header .brand { padding: 16px 34px 16px 24px; }
  .brand .logo { height: 62px; }
  .qc { position: absolute; left: 50px; right: 50px; top: 270px; background: #fff; border-radius: 40px; padding: 30px 40px 34px; box-shadow: 0 20px 50px rgba(0,0,40,.3); }
  .qc .meta { font-weight: 800; font-size: 28px; color: #8C8EB4; letter-spacing: 2px; display: flex; align-items: center; gap: 14px; }

  .qc .q { margin-top: 12px; font-weight: 900; font-size: 56px; color: #14156A; }
  .hlm { background: linear-gradient(transparent 56%, #CDEEFF 56%) no-repeat; padding: 0 6px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; }
  .opt { position: relative; background: #F1F2FB; border-radius: 22px; padding: 14px 24px; font-weight: 900; font-size: 46px; color: #14156A; }
  .opt b { color: #3A3CF4; margin-right: 12px; }
  .opt .x { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 46px; }
  .bub { position: absolute; background: #fff; border: 6px solid #12133F; border-radius: 34px; padding: 10px 34px; font-weight: 900; font-size: 84px; color: #12133F; box-shadow: 0 12px 30px rgba(0,0,40,.3); }
  .redx { position: absolute; font-weight: 900; font-size: 170px; color: #E5484D; text-shadow: 0 6px 0 rgba(0,0,0,.2); }
  .fx { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-weight: 900; font-size: 170px; color: #fff; line-height: 1; text-shadow: 0 10px 0 rgba(10,10,80,.35); white-space: nowrap; }
  .fx span { border-radius: 20px; padding: 0 6px; }
  .fx span.hl { background: #FFC83D; color: #14156A; text-shadow: none; }
  .fx sub { font-size: .55em; }
  .ball { position: absolute; width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 42px; border: 6px solid #12133F; }
  .ball.Ca { background: radial-gradient(circle at 35% 30%, #D6F5C8, #7BC96F 70%); color: #12133F; }
  .ball.O { background: radial-gradient(circle at 35% 30%, #FF9AA0, #E5484D 70%); color: #fff; }
  .ball.H { background: radial-gradient(circle at 35% 30%, #fff, #DADDF0 70%); color: #12133F; }
  .cnt { position: absolute; font-weight: 900; color: #FFC83D; text-shadow: 0 8px 0 rgba(10,10,80,.35); line-height: 1; }
  .rowlbl { position: absolute; font-weight: 900; font-size: 40px; color: rgba(255,255,255,.75); }
  .stamp2 { font-weight: 900; color: #12133F; background: #FFC83D; padding: 14px 36px; font-size: 64px; border-radius: 18px; transform: rotate(-6deg); box-shadow: 0 12px 30px rgba(0,0,40,.35); white-space: nowrap; }
  .sum { display: flex; align-items: center; gap: 22px; background: #fff; border-radius: 30px; padding: 22px 30px; font-weight: 900; font-size: 46px; color: #14156A; box-shadow: 0 14px 34px rgba(0,0,40,.25); }
  .sum .k { width: 70px; height: 70px; border-radius: 50%; background: #3A3CF4; color: #fff; display: grid; place-items: center; flex: none; }

<body data-smooth data-pops="off">

      <div class="abs" style="left:0;right:0;top:980px;text-align:center" data-in="s7#4+0.3" data-anim="up" data-out="s8"><span class="tag y" style="font-size:44px">(OH)₂ = O₂ + H₂</span></div>
