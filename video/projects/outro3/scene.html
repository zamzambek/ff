<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<title>KAINAP — концовка «Символ → логотип»</title>
<link rel="stylesheet" href="../../engine/style.css">
<style>
  html, body, #stage { width: 1920px !important; height: 1080px !important; }
  :root { --gold: #FFC46B; --heart: #FF3B5C; }
  #stage { background: #06070F; }
  .abs { position: absolute; }
  .scene.full { top: 0; height: 1080px; display: block; }
  .bokeh { position: absolute; inset: 0; overflow: hidden; }
  .vign { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 40%, rgba(0,0,0,.8) 100%); pointer-events: none; }
  .orb { position: absolute; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #FFE0B0, var(--gold) 55%, #C9781A); box-shadow: 0 0 30px 10px rgba(255,196,107,.55), 0 0 100px 40px rgba(255,196,107,.22); }
  .trail { position: absolute; width: 4px; margin-left: -2px; background: linear-gradient(rgba(255,196,107,.7), rgba(255,196,107,0)); transform-origin: 50% 0; }
  .gl { fill: none; stroke: var(--gold); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 10px rgba(255,196,107,.9)); }
  .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; }
  .cap { top: auto; bottom: 60px; left: 200px; right: 200px; }
  .cap-box { background: none; box-shadow: none; color: #fff; font-size: 50px; line-height: 1.3; text-shadow: 0 4px 18px rgba(0,0,0,.9); padding: 0; max-width: 1500px; }
  .cap-box .w { padding: 0 3px; }
  .cap-box .w.key { color: var(--gold); }
</style>
</head>
<body class="cap-plain" data-pops="off">
<div id="stage">
  <section class="scene full" data-from="s1-1.0">
    <div class="abs" style="inset:0;transform-origin:50% 35%" data-zoom="1,1.07">
      <div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 30%,#161A44,#06070F 70%)"></div>
      <div class="bokeh" data-n="16"></div>
      <div class="star" style="left:200px;top:120px" data-float></div><div class="star" style="left:520px;top:80px"></div>
      <div class="star" style="left:1300px;top:140px" data-float></div><div class="star" style="left:1650px;top:90px"></div>
      <div class="star" style="left:1500px;top:300px"></div><div class="star" style="left:330px;top:340px" data-float></div>
      <!-- тёплое свечение там, где родится логотип -->
      <div class="abs" style="left:560px;top:120px;width:800px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(255,196,107,.22),rgba(255,196,107,0) 65%)" data-in="s1#4" data-anim="fade"></div>
      <!-- электрон поднимается и оставляет след -->
      <div class="trail" style="left:808px;top:279px;height:780px" data-in="s1-0.9" data-anim="fade" data-out="s2#0"></div>
      <div class="orb" style="left:808px;top:279px" data-move="s1-1.0:0,820;s1-0.95:0,0,1.9" data-out="s3#0"></div>
      <!-- молекула логотипа рисуется светом -->
      <svg class="abs" style="left:750px;top:260px" width="420" height="264" viewBox="0 0 420 264" data-out="s3#0+0.4">
        <path class="gl" d="M58 19 L58 66" data-in="s1#3" data-anim="draw"/>
        <path class="gl" d="M58 66 L100 90 L100 138 L58 162 L16 138 L16 90 Z" data-in="s1#4" data-anim="draw"/>
        <path class="gl" d="M58 162 L60 207 L104 237" data-in="s2#1" data-anim="draw"/>
      </svg>
      <div class="orb" style="left:810px;top:467px;width:30px;height:30px;margin:-15px" data-in="s2#1+0.3" data-anim="pop" data-out="s3#0+0.4"></div>
      <div class="orb" style="left:854px;top:497px;width:30px;height:30px;margin:-15px" data-in="s2#2" data-anim="pop" data-out="s3#0+0.4"></div>
      <!-- настоящий логотип проявляется на «KAINAP» -->
      <img class="abs" src="../../assets/brand/kainap-logo-white.png" alt="" style="left:750px;top:260px;width:420px;filter:drop-shadow(0 0 24px rgba(255,196,107,.7))" data-in="s3#0" data-anim="fade">
      <div class="abs" style="left:0;right:0;top:575px;text-align:center;font-weight:900;font-size:96px;color:#fff;letter-spacing:14px;text-shadow:0 0 30px rgba(255,196,107,.35)" data-in="s3#0+0.15" data-anim="fade">KAINAP</div>
      <div class="abs" style="left:0;right:0;top:700px;text-align:center;font-weight:800;font-size:36px;color:rgba(255,255,255,.65);letter-spacing:4px" data-in="s3#2" data-anim="fade">химия · биология</div>
      <div class="abs" style="left:0;right:0;top:770px;text-align:center;font-weight:900;font-size:44px;color:var(--gold)" data-in="s4#3" data-anim="up">акысыз сынамык сабак — профилде · @kainap.kg</div>
    </div>
    <div class="vign"></div>
  </section>
  <div class="cap"></div>
</div>
<script src="build/timings.js"></script>
<script src="../../engine/engine.js"></script>
<script src="../../engine/fx.js"></script>
</body>
</html>
